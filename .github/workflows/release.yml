name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
          - os: ubuntu-22.04
            goos: linux
            goarch: arm
            goarm: '7'
          # macOS (Intel), NOTE: github has barely any runners for these anymore
          #- os: macos-13
          #  goos: darwin
          #  goarch: amd64
          # macOS (Apple Silicon)
          - os: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          export CGO_ENABLED=0
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          if [ -n "${{ matrix.goarm }}" ]; then
            export GOARM=${{ matrix.goarm }}
          fi

          # Build all commands
          for cmd in misterclaw misterclaw-mcp misterclaw-send confstr-update; do
            bin="${cmd}-${GOOS}-${GOARCH}"
            if [ -n "${{ matrix.goarm }}" ]; then
              bin="${cmd}-${GOOS}-arm${{ matrix.goarm }}"
            fi
            go build -trimpath -ldflags="-s -w" -o "dist/${bin}" ./cmd/${cmd}/
            echo "Built: ${bin}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: Flatten artifact directories
        run: |
          mkdir -p release
          find dist/ -type f -exec mv {} release/ \;

      - name: Create checksums
        run: |
          cd release
          sha256sum * > ../checksums.txt
          cat ../checksums.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" release/* checksums.txt \
            --title "$TAG" \
            --generate-notes
